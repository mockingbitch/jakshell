# Cấu hình JakShell — đặt tại ~/.jakshrc.toml
# Mọi mục đều tuỳ chọn. Xoá hoặc comment để dùng mặc định.

# Khuôn prompt. Các biến: {accent} {success} {error} {dim} {reset}
# {cwd} {cwd_short} {git} {arrow} {status}
prompt = "{accent}{cwd_short}{reset}{git} {arrow} "

[theme]
accent = "bright_cyan"
success = "bright_green"
error = "bright_red"
dim = "bright_black"
arrow = "❯"
git_branch_icon = " "
use_color = true

[ui]
# In 1 dòng trống trước mỗi prompt để các khối lệnh tách biệt nhau,
# dễ nhìn lại output cũ. false = prompt sát nhau như bash/zsh truyền thống.
blank_line = true
# Đường kẻ mờ ngang giữa các khối lệnh: "none" hoặc "line"
separator = "none"

[timing]
# Hiển thị thời gian thực thi sau mỗi lệnh
enabled = true
# Chỉ hiện nếu thời gian >= ngưỡng này (ms). 0 = luôn hiện.
# Thử 200 hoặc 500 nếu thấy nhiễu với lệnh nhanh.
threshold_ms = 0
# Khi exit code != 0, có in thêm "✗ exit N" không.
show_status = true
# Khi lệnh fail, in gợi ý giải thích mã exit (126/2/130/137/…)
show_hint = true

[greeting]
# Bật toàn bộ banner khi mở shell
enabled = true
# Dòng "Chào buổi sáng/trưa/chiều/tối, <tên>! Hôm nay là …"
show_greeting = true
# Mẹo ngẫu nhiên
show_tip = true
# Tên hiển thị (rỗng = lấy từ $USER)
name = ""

[update]
# Kiểm tra phiên bản mới khi mở shell. Việc gọi mạng CHẠY NỀN nên không bao
# giờ làm chậm lúc khởi động; thông báo (nếu có bản mới) hiện ở lần mở kế tiếp.
check = true
# Tối thiểu bao nhiêu giờ giữa 2 lần gọi mạng kiểm tra.
interval_hours = 24
# Khi chọn "để sau" (l/Enter): im trong bao nhiêu giờ rồi mới nhắc lại.
remind_hours = 8
# true = hỏi tương tác (có / để sau / bỏ qua / không).
# false = chỉ in 1 dòng nhắc "gõ jak update", không hỏi.
prompt = true

[aliases]
ll = "ls -lah"
la = "ls -A"
gs = "git status"
gd = "git diff"
gl = "git log --oneline --graph --decorate -20"
tlf = "tail -f"

# Bí danh tiếng Việt — thân thiện cho lowtech user
tim = "jak find"
dondep = "jak clean"
napnhat = "jak update"
mo = "jak open"
maytinh = "jak sysinfo"
giaithich = "explain"

[env]
EDITOR = "vim"
LANG = "en_US.UTF-8"
