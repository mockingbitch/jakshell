[package]
name = "jaksh"
version = "1.0.10"
edition = "2021"
description = "JakShell — a fast, friendly Rust shell for macOS and Linux"
authors = ["JakShell contributors"]
license = "MIT"
repository = "https://github.com/mockingbitch/jakshell"
readme = "README.md"

[[bin]]
name = "jaksh"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
rustyline = { version = "14", features = ["with-file-history"] }
rustyline-derive = "0.10"
crossterm = "0.27"
anyhow = "1"
thiserror = "1"
dirs = "5"
shellexpand = "3"
glob = "0.3"
nix = { version = "0.29", features = ["process", "signal", "term"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
chrono = "0.4"
strsim = "0.11"
which = "6"
